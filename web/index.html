<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NBA Player Ranker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏀%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">2026-27 NBA</p>
          <h1>NBA Player Ranker</h1>
        </div>
        <label class="theme-toggle theme-toggle-desktop">
          <span class="theme-text">Dark Mode</span>
          <span class="theme-symbols" aria-hidden="true">☀️</span>
          <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark Mode">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </header>

      <div class="menu-row">
        <button
          id="mobile-menu-toggle"
          class="mobile-menu-toggle"
          type="button"
          aria-controls="controls-panel"
          aria-expanded="false"
        >
          <span class="mobile-menu-icon" aria-hidden="true">&#9776;</span>
          <span class="mobile-menu-label">Menu</span>
        </button>
        <nav class="view-tabs" aria-label="Explorer views">
          <button class="view-tab is-active" type="button" data-view="players" data-mobile-label="Info" aria-current="page">Player Info</button>
          <button class="view-tab" type="button" data-view="fantasy" data-mobile-label="Stats" aria-current="false">Fantasy Stats</button>
        </nav>
        <button
          id="desktop-filter-toggle"
          class="desktop-filter-toggle"
          type="button"
          aria-controls="controls-panel"
          aria-expanded="true"
        >
          Hide Controls
        </button>
        <label class="theme-toggle theme-toggle-mobile">
          <span class="theme-text">Dark Mode</span>
          <span class="theme-symbols" aria-hidden="true">☀️</span>
          <input id="theme-toggle-mobile" type="checkbox" role="switch" aria-label="Dark Mode">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>

      <section id="controls-panel" class="filters" aria-labelledby="controls-heading">
        <h2 id="controls-heading" class="sr-only">Player filters and actions</h2>
        <label class="field search-field" for="search-input">
          <span>Search</span>
          <input id="search-input" type="search" placeholder="Player Name">
        </label>

        <label class="field" for="team-filter">
          <span>Team</span>
          <select id="team-filter">
            <option value="">All Teams</option>
          </select>
        </label>

        <label class="field" for="position-filter">
          <span>Position</span>
          <select id="position-filter">
            <option value="">All Positions</option>
          </select>
        </label>

        <label class="field" for="experience-filter">
          <span>Experience</span>
          <select id="experience-filter">
            <option value="">Default</option>
            <option value="veteran">Veteran</option>
            <option value="rookie">Rookie</option>
          </select>
        </label>

        <label class="field" for="sort-select">
          <span>Sort</span>
          <select id="sort-select">
            <option value="index-asc">Default</option>
            <option value="personal-rank-asc">Rank</option>
            <option value="name-asc">Name A to Z</option>
            <option value="team-asc">Team A to Z</option>
            <option value="position-asc">Position A to Z</option>
          </select>
        </label>
        <div class="action-buttons">
          <button id="seed-button" class="secondary-button" type="button">Seed</button>
          <div class="export-menu">
            <button
              id="export-button"
              class="secondary-button"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="export-menu"
            >
              Export
            </button>
            <div id="export-menu" class="export-options" role="menu" hidden>
              <button id="export-file-button" type="button" role="menuitem">CSV File (Yahoo!)</button>
              <button id="export-copy-button" type="button" role="menuitem">CSV To Clipboard (Yahoo!)</button>
              <button id="export-full-csv-button" type="button" role="menuitem">CSV File (Complete)</button>
              <button id="export-full-xlsx-button" type="button" role="menuitem">XLSX File (Complete)</button>
              <button id="export-full-json-button" type="button" role="menuitem">JSON File (Complete)</button>
              <button id="export-index-override-button" type="button" role="menuitem">New Site Index Data</button>
            </div>
          </div>
          <button id="top-button" class="secondary-button" type="button">Top</button>
          <button id="reset-button" class="secondary-button" type="button">Reset</button>
          <button
            id="rank-refresh-button"
            class="secondary-button rank-refresh-button"
            type="button"
            hidden
          >Refresh Sort</button>
        </div>
        <span id="export-status" class="action-status" aria-live="polite"></span>

      </section>

      <section class="table-section" aria-labelledby="results-heading">
        <h2 id="results-heading" class="sr-only">Filtered players</h2>
        <div id="loading-state" class="status-line">Loading Players...</div>
        <div class="table-wrap" hidden>
          <table>
            <thead id="players-head"></thead>
            <tbody id="players-body"></tbody>
          </table>
        </div>
        <div class="table-scrollbar" aria-label="Scroll table columns" role="region" tabindex="0" hidden>
          <div class="table-scrollbar-inner"></div>
        </div>
        <div id="empty-state" class="status-line" hidden>No Players Match Those Filters.</div>
      </section>
    </main>

    <dialog id="reset-dialog" class="reset-dialog" aria-labelledby="reset-dialog-title">
      <form method="dialog" class="reset-dialog-card">
        <h2 id="reset-dialog-title">Reset Options</h2>
        <p>Reset only the current sort order, or delete saved ranks, team edits, and theme preference from this browser.</p>
        <div class="reset-dialog-actions">
          <button id="reset-filters-button" class="secondary-button" type="button">Reset Sorts</button>
          <button id="delete-saved-data-button" class="secondary-button danger-button" type="button">Delete Saved Data</button>
          <button class="secondary-button" type="submit">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="player-detail-dialog" class="player-detail-dialog" aria-labelledby="player-detail-title">
      <div class="player-detail-card">
        <div class="player-detail-header">
          <div>
            <h2 id="player-detail-title">Player Details</h2>
            <p id="player-detail-subtitle"></p>
          </div>
          <form method="dialog">
            <button id="player-detail-close-button" class="player-detail-close" type="submit" aria-label="Close">×</button>
          </form>
        </div>
        <dl id="player-detail-list" class="player-detail-list"></dl>
      </div>
    </dialog>

    <script src="players-data.js"></script>
    <script src="app-logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
